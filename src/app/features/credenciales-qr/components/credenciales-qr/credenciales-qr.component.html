<div class="page">
  <header class="page-head">
    <h1>Credenciales QR</h1>
    <p>Gestione la generación, el envío y el seguimiento de las credenciales QR de los estudiantes.</p>
  </header>

  <div class="tabs-shell">
    <div class="tabs" role="tablist" aria-label="Secciones de Credenciales QR">
      <button
        type="button"
        class="tab"
        [class.tab--active]="tabActiva === 'OPERACIONES'"
        [attr.aria-selected]="tabActiva === 'OPERACIONES'"
        (click)="seleccionarTab('OPERACIONES')">
        Operaciones
      </button>
      <button
        type="button"
        class="tab"
        [class.tab--active]="tabActiva === 'ESTADO'"
        [attr.aria-selected]="tabActiva === 'ESTADO'"
        (click)="seleccionarTab('ESTADO')">
        Estado
      </button>
    </div>
  </div>

  <div
    class="tab-panel"
    role="tabpanel"
    [attr.aria-hidden]="tabActiva !== 'OPERACIONES'"
    [hidden]="tabActiva !== 'OPERACIONES'">
    <section class="section">
      <app-qr-credential-generation-page [embedded]="true"></app-qr-credential-generation-page>
    </section>

    <section class="section">
      <app-qr-credential-delivery-page [embedded]="true"></app-qr-credential-delivery-page>
    </section>
  </div>

  <div
    class="tab-panel"
    role="tabpanel"
    [attr.aria-hidden]="tabActiva !== 'ESTADO'"
    [hidden]="tabActiva !== 'ESTADO'">
    <section class="section">
      <app-qr-credential-status-table [embedded]="true"></app-qr-credential-status-table>
    </section>
  </div>
</div>
